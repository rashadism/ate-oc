<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 410" role="img" aria-label="OpenChoreo model. Platform engineer types (ProjectType, ComponentType, Trait, ResourceType, Environment and Pipeline, DataPlane) and developer intent (Project, Component, Workload, Resource). Component plus Workload plus types are frozen into an immutable ComponentRelease, bound per environment by a ReleaseBinding, rendered into a RenderedRelease, and applied by the cluster agent into the cell namespace, which the ProjectReleaseBinding creates from the ProjectType.">
  <style>
    text{fill:#18211D;font:12px "IBM Plex Sans",system-ui,sans-serif}
    .t{font:600 13px "IBM Plex Sans Condensed",sans-serif}
    .h{font:600 14px "IBM Plex Sans Condensed",sans-serif;fill:#5A655F;letter-spacing:.04em}
    .sub{fill:#5A655F;font-size:11px}
    .mono{font:11px "IBM Plex Mono",ui-monospace,monospace;fill:#5A655F}
    .oc{fill:#DDEBF1;stroke:#2C6E8A;stroke-width:1.3}
    .ln{stroke:#18211D;stroke-width:1.3;fill:none}
    .ln.oc{stroke:#2C6E8A;fill:none}
    .ahO{fill:#2C6E8A}
  </style>
  <rect x="0" y="0" width="1000" height="410" fill="#FFFFFF"/>
  <defs>
    <marker id="o-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahO" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>
  <text class="h" x="20" y="38">PLATFORM ENGINEER DEFINES</text>
  <rect class="oc" x="20" y="50" width="150" height="50"/><text class="t" x="95" y="80" text-anchor="middle">ProjectType</text>
  <rect class="oc" x="182" y="50" width="150" height="50"/><text class="t" x="257" y="80" text-anchor="middle">ComponentType</text>
  <rect class="oc" x="344" y="50" width="150" height="50"/><text class="t" x="419" y="80" text-anchor="middle">Trait</text>
  <rect class="oc" x="506" y="50" width="150" height="50"/><text class="t" x="581" y="80" text-anchor="middle">ResourceType</text>
  <rect class="oc" x="668" y="50" width="150" height="50"/><text class="t" x="743" y="74" text-anchor="middle">Environment</text><text class="sub" x="743" y="90" text-anchor="middle">+ DeploymentPipeline</text>
  <rect class="oc" x="830" y="50" width="150" height="50"/><text class="t" x="905" y="80" text-anchor="middle">DataPlane</text>

  <text class="h" x="20" y="140">DEVELOPER DECLARES</text>
  <rect class="oc" x="20" y="150" width="150" height="50"/><text class="t" x="95" y="180" text-anchor="middle">Project</text>
  <rect class="oc" x="182" y="150" width="150" height="50"/><text class="t" x="257" y="180" text-anchor="middle">Component</text>
  <rect class="oc" x="344" y="150" width="150" height="50"/><text class="t" x="419" y="174" text-anchor="middle">Workload</text><text class="sub" x="419" y="190" text-anchor="middle">image · endpoints · deps</text>
  <rect class="oc" x="506" y="150" width="150" height="50"/><text class="t" x="581" y="174" text-anchor="middle">Resource</text><text class="sub" x="581" y="190" text-anchor="middle">db · cache · queue</text>

  <line class="ln oc" x1="95" y1="100" x2="95" y2="148" marker-end="url(#o-ah)"/>
  <line class="ln oc" x1="257" y1="100" x2="257" y2="148" marker-end="url(#o-ah)"/>
  <line class="ln oc" x1="400" y1="100" x2="300" y2="148" marker-end="url(#o-ah)"/>
  <text class="sub" x="368" y="130">attached</text>
  <line class="ln oc" x1="581" y1="100" x2="581" y2="148" marker-end="url(#o-ah)"/>

  <text class="h" x="182" y="250">RELEASE MACHINERY (per component)</text>
  <rect class="oc" x="182" y="262" width="150" height="56"/><text class="t" x="257" y="286" text-anchor="middle">ComponentRelease</text><text class="sub" x="257" y="303" text-anchor="middle">immutable snapshot</text>
  <rect class="oc" x="380" y="262" width="190" height="56"/><text class="t" x="475" y="286" text-anchor="middle">ReleaseBinding</text><text class="sub" x="475" y="303" text-anchor="middle">per env · configs · Active/Undeploy</text>
  <rect class="oc" x="618" y="262" width="150" height="56"/><text class="t" x="693" y="286" text-anchor="middle">RenderedRelease</text><text class="sub" x="693" y="303" text-anchor="middle">rendered objects</text>
  <rect class="oc" x="818" y="252" width="162" height="76"/><text class="t" x="899" y="280" text-anchor="middle">Cell namespace</text><text class="sub" x="899" y="297" text-anchor="middle">dp-… on the data plane</text><text class="mono" x="899" y="314" text-anchor="middle">objects + NetworkPolicy</text>

  <line class="ln oc" x1="257" y1="200" x2="257" y2="260" marker-end="url(#o-ah)"/>
  <line class="ln oc" x1="419" y1="200" x2="310" y2="260" marker-end="url(#o-ah)"/>
  <text class="sub" x="372" y="234">frozen in</text>
  <line class="ln oc" x1="332" y1="290" x2="378" y2="290" marker-end="url(#o-ah)"/>
  <line class="ln oc" x1="570" y1="290" x2="616" y2="290" marker-end="url(#o-ah)"/>
  <line class="ln oc" x1="768" y1="290" x2="816" y2="290" marker-end="url(#o-ah)"/>
  <text class="mono" x="792" y="282" text-anchor="middle">SSA</text>
  <polyline class="ln oc" points="743,100 743,232 475,232 475,260" marker-end="url(#o-ah)"/>
  <text class="sub" x="610" y="226" text-anchor="middle">which env</text>
  <line class="ln oc" x1="905" y1="100" x2="905" y2="250" marker-end="url(#o-ah)"/>
  <text class="sub" x="913" y="180">hosts</text>

  <rect class="oc" x="20" y="344" width="150" height="50"/><text class="t" x="95" y="366" text-anchor="middle">ProjectReleaseBinding</text><text class="sub" x="95" y="382" text-anchor="middle">per env</text>
  <line class="ln oc" x1="60" y1="200" x2="60" y2="342" marker-end="url(#o-ah)"/>
  <polyline class="ln oc" points="170,369 940,369 940,330" marker-end="url(#o-ah)"/>
  <text class="sub" x="555" y="361" text-anchor="middle">creates the cell namespace (and its shared policies) from the ProjectType</text>
</svg>
