---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: oc-substrate-operator
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  - secrets
  verbs:
  - get
- apiGroups:
  - ""
  resources:
  - namespaces
  - nodes
  - pods
  - services
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ate.dev
  resources:
  - workerpools
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - discovery.k8s.io
  resources:
  - endpointslices
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - events.k8s.io
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - networking.k8s.io
  resources:
  - networkpolicies
  verbs:
  - create
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - networking.k8s.io
  resources:
  - servicecidrs
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - substrate.openchoreo.dev
  resources:
  - actors
  - actortemplates
  verbs:
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - substrate.openchoreo.dev
  resources:
  - actors/finalizers
  - actortemplates/finalizers
  - retainedactors/finalizers
  verbs:
  - update
- apiGroups:
  - substrate.openchoreo.dev
  resources:
  - actors/status
  - actortemplates/status
  - retainedactors/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - substrate.openchoreo.dev
  resources:
  - retainedactors
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
