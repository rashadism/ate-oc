# The data plane cluster-agent server-side applies the ActorTemplates and
# Actors that the substrate-actor ComponentType renders.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: oc-substrate-cluster-agent
rules:
  - apiGroups: [substrate.openchoreo.dev]
    resources: [actortemplates, actors]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: oc-substrate-cluster-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: oc-substrate-cluster-agent
subjects:
  - kind: ServiceAccount
    name: {{ .Values.openchoreo.clusterAgent.serviceAccount }}
    namespace: {{ .Values.openchoreo.clusterAgent.namespace }}
