image:
  repository: ghcr.io/rashadism/ate-oc
  tag: v0.3.0
  pullPolicy: IfNotPresent

# Snapshot object-store prefix; each atespace gets a sub-path. Required.
storageLocation: ""

ateapi:
  target: dns:///api.ate-system.svc:443
  serverName: api.ate-system.svc

# Namespace Substrate is installed in.
ateSystemNamespace: ate-system

# Namespace for the shared actor-identity-attribution ConfigMap (name/project/
# environment -> UID, for log backends that can only recover names from an
# actor's log identity). Empty disables publishing it.
attributionConfigMapNamespace: ""

# Namespace Substrate's privileged worker pools run in.
workerPoolNamespace: ate-workers

# Restricts ateapi ingress to Substrate's own components and this operator.
# ateapi authenticates mTLS peers but does not authorize them.
ateapiLockdown:
  enabled: true
  substrateComponents: [atenet-router, atenet-egress, ate-controller, atelet]

resources:
  requests: {cpu: 50m, memory: 64Mi}
  limits: {memory: 256Mi}

frontdoor:
  replicas: 2
  port: 8080
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {memory: 512Mi}

# Substrate only runs digest-pinned images, so the operator resolves tags to
# digests. Public images need nothing; for private registries, name a
# kubernetes.io/dockerconfigjson Secret in the release namespace.
registry:
  pullSecret: ""
  insecureRegistries: []

egress:
  # Destinations actors can never reach. Actor traffic leaves through
  # Substrate's shared egress pod, so a metadata server (which identifies
  # callers by source IP) would hand an actor the egress pod's cloud
  # credentials instead of refusing. Pods get their own identity; actors
  # can't, so these are blocked. Add your platform's endpoints if missing.
  blockedCIDRs:
    - 169.254.0.0/16      # link-local: GCP, AWS, Azure IMDS, OpenStack, DigitalOcean, Oracle
    - fe80::/10           # IPv6 link-local
    - fd00:ec2::254/128   # AWS IMDS over IPv6
    - 168.63.129.16/32    # Azure WireServer (host agent)
    - 100.100.100.200/32  # Alibaba Cloud metadata

# Router lockdown and front door ingress.
networkPolicies:
  enabled: true

openchoreo:
  # The data plane cluster-agent that applies rendered resources.
  clusterAgent:
    namespace: openchoreo-data-plane
    serviceAccount: cluster-agent-dataplane
  # The substrate-actor ClusterComponentType, a control plane resource;
  # set enabled to false on a data-plane-only install.
  #
  # These three are cluster-wide defaults. A DataPlane can override any of them
  # per DataPlane via its own annotations, without a new Helm release:
  #   substrate.openchoreo.dev/sandbox-class: microvm
  #   substrate.openchoreo.dev/sandbox-config-name: microvm-default
  #   substrate.openchoreo.dev/worker-pool: <value>  # must match a WorkerPool's
  #     own "substrate.openchoreo.dev/worker-pool" label
  componentType:
    enabled: true
    sandboxClass: gvisor
    sandboxConfigName: gvisor-default
    # Labels of the WorkerPool actors run on; empty lets Substrate choose.
    workerSelector: {}
